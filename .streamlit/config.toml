[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#172B40"
font = "sans serif"
headingFontSizes = ["2.75rem", "1.4rem", "1.15rem", "1rem", "1rem", "1rem"]

[client]
toolbarMode = "viewer"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
